{% extends 'students/base.html' %}
{% block title %}Delete Student{% endblock %}
{% block content %}
<h2>Delete {{ student.full_name }}?</h2>
<p>This action cannot be undone.</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>
<a href="{% url 'student_list' %}">Cancel</a>
{% endblock %}
